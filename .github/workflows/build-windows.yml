name: Build and Release GeoPort Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v2.3.3-cn）'
        required: true
        default: 'v2.3.3-cn'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask requests psutil pycountry pyuac pymobiledevice3

      - name: 使用 PyInstaller 打包 EXE
        working-directory: src
        run: |
          pyinstaller --onefile --name "GeoPort_CN" `
            --add-data "templates;templates" `
            --collect-all pymobiledevice3 `
            --recursive-copy-metadata pymobiledevice3 `
            --copy-metadata pyimg4 `
            --collect-data pycountry `
            --uac-admin `
            main.py

      - name: 自动发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: GeoPort 汉化版 ${{ inputs.version || github.ref_name }}
          files: src/dist/GeoPort_CN.exe
